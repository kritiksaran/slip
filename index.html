<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaji Tim</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--primary:#2563eb;--muted:#6b7280;--border:#e5e7eb;}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial;background:var(--bg);padding:12px;}
  h2,h3,h4{margin:6px 0}
  /* CARD */
  .card{background:var(--card);padding:14px;border-radius:12px;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.06);}
  /* BUTTON */
  button{padding:8px 12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;}
  button.secondary{background:var(--muted)}
  button:disabled{opacity:.6;cursor:not-allowed}/* FORM */
  label{font-size:13px;font-weight:600;margin-top:8px;display:block;}input,select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  /* TABLE */
  table{width:100%;border-collapse:collapse;}
  th,td{padding:6px 8px;font-size:12px;line-height:1.2;}
  th{background:#f9fafb;text-align:center}
  /* MODAL */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal.active{display:flex}
  .box{background:#fff;padding:14px;border-radius:14px;width:95%;max-width:420px;max-height:90vh;overflow:auto;}
  /* SLIP */
  #slip table{width:100%;border-collapse:collapse;font-size:11px;line-height:1.2;}
  #slip td{padding:2px 4px;vertical-align:top;}
  hr{border:0;border-top:1px solid #000}
</style>
</head>

<body>
  <!-- HEADER -->
  <div class="card">
    <h2>Gaji Tim</h2>
    <div class="grid">
      <select id="filter">
        <option value="">Semua Periode</option>
      </select>
      <button onclick="openInput()">+ Input Gaji</button>
    </div>
  </div>
  <!-- TABLE DATA -->
  <div class="card">
    <table style="text-align: center;">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Nama Tim</th>
          <th>Jabatan</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <!-- INPUT MODAL -->
  <div class="modal" id="inputM">
    <div class="box">
      <h3>Input Gaji</h3>
      <label>Tanggal</label>
      <input type="date" id="tanggal">
      <label>Periode</label>
      <input id="periode" placeholder="Januari">
      <label>Jabatan</label>
      <select id="jabatan"></select>
      <label>Nama Tim</label>
      <select id="nama_tim"></select>
      <label>Gaji Pokok</label>
      <input type="number" id="gaji">
      <label>Uang Makan</label>
      <input type="number" id="makan">
      <label>Transport</label>
      <input type="number" id="transport">
      <h4>Bonus</h4>
      <div id="bonusBox"></div>
      <button onclick="addBonus()">+ Bonus</button>
      <h4>Potongan</h4>
      <div id="potBox"></div>
      <button onclick="addPot()">+ Potongan</button>
      <br>
      <br>
      <button id="btnSimpan" onclick="simpan()">Simpan</button>
      <button class="secondary" onclick="closeInput()">Tutup</button>
    </div>
  </div>
  <!-- PREVIEW -->
  <div class="modal" id="prevM">
    <div class="box">
      <div id="slip"></div>
      <br>
      <button onclick="download()">Unduh JPEG</button>
      <button class="secondary" onclick="closePrev()">Tutup</button>
    </div>
  </div>

  /* ================= DATA TIM ================= */
  const DATA_TIM = {
    Admin: ["Sila","Devita","Lia","Firda","Intan","Fahim","Isti"],
    Editor: ["Ainul","Novian","Rosad","Budi"],
    Mahar:["Endras","Riska"]
  };
  let DATA = [], CUR = null;
  let IS_SAVING = false;
  /* ================= UTIL ================= */
  function fmt(v){
    const d = new Date(v);
    return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
  }
  /* ================= MODAL ================= */
  const openInput = () => inputM.classList.add("active");
  const closeInput = () => inputM.classList.remove("active");
  const openPrev  = () => prevM.classList.add("active");
  const closePrev = () => prevM.classList.remove("active");
  /* ================= INIT JABATAN ================= */
  jabatan.innerHTML ='<option value="">Pilih Jabatan</option>' + Object.keys(DATA_TIM).map(j=>`<option>${j}</option>`).join("");
  jabatan.onchange = () => {
    nama_tim.innerHTML = DATA_TIM[jabatan.value]? DATA_TIM[jabatan.value].map(t=>`<option>${t}</option>`).join("")
    : "";
  };
  /* ================= BONUS & POTONGAN ================= */
  function addBonus(){
    bonusBox.insertAdjacentHTML("beforeend",`
      <div class="grid">
        <input placeholder="Keterangan">
        <input type="number" placeholder="Nilai">
      </div>
    `);
  }
  function addPot(){
    potBox.insertAdjacentHTML("beforeend",`
      <div class="grid">
        <input placeholder="Keterangan">
        <input type="number" placeholder="Nilai">
    </div>
    `);
  }
  /* ================= HELPER FORMAT PERIODE ================= */
  const fmtPeriode = (x) => {
    if (!x) return "-";
    const date = new Date(x);
    // Jika x bukan tanggal valid, kembalikan x apa adanya
    if (isNaN(date.getTime())) return x;
    return date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  };
  /* ================= LOAD DATA ================= */
  fetch(API_URL).then(r=>r.json()).then(d=>{
    DATA = d;
    render(DATA);
    const p = [...new Set(d.map(x => fmtPeriode(x.periode)))];

    filter.innerHTML ='<option value="">Semua Periode</option>' + p.map(x => `<option value="${x}">${x}</option>`).join("");
  });
  /* ================= FILTER ================= */
  filter.onchange = () => {
    const val = filter.value;
    const filteredData = val ? DATA.filter(d => fmtPeriode(d.periode) === val) : DATA;
    render(filteredData);
  };
  /* ================= RENDER ================= */
  function render(arr){
    tbody.innerHTML = "";
    arr.forEach(d=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fmt(d.tanggal)}</td>
        <td>${d.nama_tim}</td>
        <td>${d.jabatan}</td>
        <td><button class="btn-prev">Preview</button></td>
      `;
      tr.querySelector('.btn-prev').onclick = () => preview(d);
      tbody.appendChild(tr);
    });
  }
  /* ================= SIMPAN ================= */
  function simpan(){
    if(IS_SAVING) return;
    IS_SAVING = true;
    btnSimpan.disabled = true;
    btnSimpan.textContent = "Menyimpan...";
    const bonus = [...bonusBox.children].map(b=>({
      ket: b.children[0].value,
      nilai: +b.children[1].value || 0
    }));
    const potongan = [...potBox.children].map(p=>({
      ket: p.children[0].value,
      nilai: +p.children[1].value || 0
    }));
    const total =+gaji.value + +makan.value + +transport.value + bonus.reduce((a,b)=>a+b.nilai,0)-potongan.reduce((a,b)=>a+b.nilai,0);
    fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        tanggal:tanggal.value,
        periode:periode.value,
        jabatan:jabatan.value,
        nama_tim:nama_tim.value,
        gaji_pokok:+gaji.value,
        uang_makan:+makan.value,
        transport:+transport.value,
        bonus,potongan,total
      })
    })
    .then(()=>fetch(API_URL).then(r=>r.json()))
    .then(d => {
      DATA = d;
      render(DATA);
      // === PROSES PENGOSONGAN FORM (RESET) ===
      tanggal.value = "";
      periode.value = "";
      jabatan.value = "";
      nama_tim.innerHTML = ""; 
      gaji.value = "";
      makan.value = "";
      transport.value = "";
      bonusBox.innerHTML = "";
      potBox.innerHTML = "";
      closeInput(); // Form otomatis tertutup setelah bersih
    })
    .finally(()=>{
      IS_SAVING = false;
      btnSimpan.disabled = false;
      btnSimpan.textContent = "Simpan";
    });
  }
  /* ================= PREVIEW ================= */

    <tr>

        <td style="width:20%">Tanggal</td>

    </tr>
    <tr>
        <td>Jabatan</td>
        <td>: ${d.jabatan}</td>
        
        <td>Periode</td>
        <td>: ${
  (() => {

    if (typeof d.periode === 'string' && d.periode.includes('T')) {
      const date = new Date(d.periode);

        year: 'numeric'

}</td>

            </td>
        </tr>

    <hr style="border: 1px solid black; margin: 15px 0;">

/* ================= DOWNLOAD (FIXED) ================= */
function download() {
  if (!CUR) return;

  // Ganti target ke ID "slip-capture" agar mengambil div yang sudah ada padding-nya
  const target = document.querySelector("#slip-capture"); 

  html2canvas(target, {
    scale: 2,             
    useCORS: true,        
    allowTaint: false,    
    backgroundColor: "#ffffff", 
    logging: false,
    scrollY: -window.scrollY, 
    windowWidth: target.offsetWidth, // Sesuaikan lebar target
    windowHeight: target.offsetHeight // Sesuaikan tinggi target
  }).then(canvas => {
    const d = new Date(CUR.tanggal);
    const namaFile = `Slip_${CUR.nama_tim}_${String(d.getDate()).padStart(2,"0")}${String(d.getMonth()+1).padStart(2,"0")}.jpg`;
    
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.download = namaFile;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }).catch(err => {
    console.error("Gagal cetak:", err);
  });
}
</script>

</body>
</html>
